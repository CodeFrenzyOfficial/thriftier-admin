name: Admin Site Staging Deployment

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "20.x"

    steps:
      - name: 🚀 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔧 Create .env.production file
        run: |
          cat > .env.production << 'EOF'
          VITE_API_URL=${{ secrets.STAGING_API_URL }}
          VITE_APP_NAME=${{ secrets.VITE_APP_NAME }}
          VITE_APP_ENV=staging
          EOF

      - name: 🏗️ Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📋 Create deployment package
        run: |
          cd dist
          tar -czf ../frontend-build.tar.gz .
          cd ..

      - name: 🔐 Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: 📤 Deploy to staging server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_PATH: /var/www/thrifter-admin-staging
        run: |
          # Add server to known hosts
          ssh-keyscan -H $STAGING_HOST >> ~/.ssh/known_hosts

          # Upload deployment package
          scp frontend-build.tar.gz $STAGING_USER@$STAGING_HOST:$DEPLOY_PATH/

          # Execute deployment script on server
          ssh $STAGING_USER@$STAGING_HOST "
            cd $DEPLOY_PATH

            # Backup current version
            if [ -d 'current' ]; then
              mv current backup-\$(date +%Y%m%d-%H%M%S)
            fi

            # Create new directory
            mkdir -p current

            # Extract new version
            tar -xzf frontend-build.tar.gz -C current/

            # Cleanup
            rm frontend-build.tar.gz

            # Keep only last 3 backups
            ls -t backup-* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true

            # Reload Nginx to serve new files
            sudo systemctl reload nginx || echo 'Nginx reload skipped (run manually if needed)'

            echo '✅ Thrifter Admin deployed successfully to $DEPLOY_PATH/current'
          "

      - name: ✅ Deployment successful
        run: |
          echo "🎉 Thrifter Admin deployed to staging successfully!"
          echo "📂 Server path: /var/www/thrifter-admin-staging/current"
          echo "🔗 Access your admin panel at: http://${{ secrets.STAGING_HOST }}"
          echo "📅 Deployed at: $(date)"

      - name: 🚨 Notify on failure
        if: failure()
        run: |
          echo "❌ Admin site deployment failed!"
          echo "📋 Please check the logs above for details."
          echo "💡 Common issues: SSH key, server path permissions, nginx config"
